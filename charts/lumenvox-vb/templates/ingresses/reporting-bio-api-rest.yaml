{{- $ingressClassName := .Values.global.lumenvox.ingress.className -}}
{{- if ne $ingressClassName "istio" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporting-bio-api-ingress
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  {{- if not .Values.global.lumenvox.ingress.disableTls }}
  tls:
  - hosts:
    - "reporting-bio-api{{ .Values.global.hostnameSuffix }}"
    secretName: {{ .Values.global.lumenvox.gateway.tlsSecretName }}
  {{- end }}
  rules:
  - host: "reporting-bio-api{{ .Values.global.hostnameSuffix }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: reporting-bio-api-service
            port:
              name: rest
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reporting-bio-api-httproute
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  parentRefs:
    - name: {{ .Values.global.lumenvox.gateway.name }}
      namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
      sectionName: web
  hostnames:
    - "reporting-bio-api{{ .Values.global.hostnameSuffix }}"
  rules:
    - backendRefs:
        - name: reporting-bio-api-service
          port: 81
{{- end }}
