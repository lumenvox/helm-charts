{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "otelcol.serviceAccountName" . }}
  namespace: {{ include "otelcol.namespace" . }}
  labels:
{{ include "otelcol.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otelcol.serviceAccountName" . }}
  labels:
{{ include "otelcol.labels" . | indent 4 }}
rules:
  # k8sattributes and prometheus kubernetes_sd.
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # kubeletstats.
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/proxy", "nodes/metrics"]
    verbs: ["get"]
{{- if .Values.gateway.clusterMetrics.enabled }}
  # k8s_cluster receiver.
  - apiGroups: [""]
    resources: ["resourcequotas", "replicationcontrollers", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "otelcol.serviceAccountName" . }}
  labels:
{{ include "otelcol.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "otelcol.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "otelcol.serviceAccountName" . }}
    namespace: {{ include "otelcol.namespace" . }}
{{- end }}
