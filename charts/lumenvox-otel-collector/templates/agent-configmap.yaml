{{- if .Values.agent.enabled }}
{{- include "otelcol.validate" . }}
{{- $filelogOn := and .Values.agent.filelog.enabled (include "otelcol.signalEnabled" (dict "root" $ "signal" "logs")) }}
{{- $filelogNamespaces := .Values.agent.filelog.namespaces | default (list (include "otelcol.namespace" .)) }}
{{- $minLevel := upper (default "" .Values.agent.filelog.minLevel) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otelcol.agentName" . }}
  namespace: {{ include "otelcol.namespace" . }}
  labels:
{{ include "otelcol.labels" . | indent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.ports.grpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.ports.http }}
    {{- if and .Values.agent.kubeletstats.enabled (include "otelcol.signalEnabled" (dict "root" $ "signal" "metrics")) }}
      kubeletstats:
        auth_type: serviceAccount
        endpoint: https://${env:{{ if eq .Values.agent.kubeletstats.endpointHost "nodeName" }}K8S_NODE_NAME{{ else }}K8S_NODE_IP{{ end }}}:10250
        insecure_skip_verify: {{ .Values.agent.kubeletstats.insecureSkipVerify }}
        collection_interval: {{ .Values.agent.kubeletstats.collectionInterval }}
        metric_groups: [node, pod, container]
    {{- end }}
    {{- if and .Values.agent.prometheusScrape.enabled (include "otelcol.signalEnabled" (dict "root" $ "signal" "metrics")) }}
      prometheus:
        config:
          scrape_configs:
            - job_name: lumenvox-annotated-pods
              scrape_interval: {{ .Values.agent.prometheusScrape.interval }}
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                # Node-local pods only.
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: k8s_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_pod_label_app]
                  action: replace
                  target_label: k8s_app
    {{- end }}
    {{- if $filelogOn }}
      filelog:
        include:
        {{- range $ns := $filelogNamespaces }}
          - /var/log/pods/{{ $ns }}_*/*/*.log
        {{- end }}
        {{- with .Values.agent.filelog.excludeContainers }}
        exclude:
        {{- range $ns := $filelogNamespaces }}
        {{- range $c := $.Values.agent.filelog.excludeContainers }}
          - /var/log/pods/{{ $ns }}_*/{{ $c }}/*.log
        {{- end }}
        {{- end }}
        {{- end }}
        start_at: {{ .Values.agent.filelog.startAt }}
        # Required by the container operator.
        include_file_path: true
        include_file_name: false
        storage: file_storage/filelog
        operators:
          - type: container
            id: container
          # Parse JSON lines into attributes["lvx"], promote known fields,
          # then drop it. The body keeps the original line.
          - type: json_parser
            id: json
            if: 'body matches "^\\s*\\{"'
            parse_to: attributes["lvx"]
            on_error: send_quiet
          - type: time_parser
            id: time
            if: 'attributes["lvx"] != nil and attributes["lvx"]["time"] != nil'
            parse_from: attributes["lvx"]["time"]
            layout_type: gotime
            layout: "2006-01-02T15:04:05.999999999Z07:00"
            on_error: send_quiet
          - type: severity_parser
            id: severity
            if: 'attributes["lvx"] != nil and attributes["lvx"]["level"] != nil'
            parse_from: attributes["lvx"]["level"]
            on_error: send_quiet
          - type: trace_parser
            id: trace
            if: 'attributes["lvx"] != nil and attributes["lvx"]["trace.id"] != nil and attributes["lvx"]["span.id"] != nil'
            trace_id:
              parse_from: attributes["lvx"]["trace.id"]
            span_id:
              parse_from: attributes["lvx"]["span.id"]
            on_error: send_quiet
          - type: move
            id: service-name
            if: 'attributes["lvx"] != nil and attributes["lvx"]["service.name"] != nil'
            from: attributes["lvx"]["service.name"]
            to: resource["service.name"]
          - type: remove
            id: drop-scratch
            if: 'attributes["lvx"] != nil'
            field: attributes["lvx"]
          - type: remove
            id: drop-path
            if: 'attributes["log.file.path"] != nil'
            field: attributes["log.file.path"]
    {{- end }}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: {{ .Values.agent.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.agent.memoryLimiter.spikeLimitPercentage }}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - tag_name: k8s.app
              key: app
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      # env only: the system detector would set host.name to the agent pod.
      resourcedetection:
        detectors: [env]
        override: false
        timeout: 5s
    {{- if and $filelogOn $minLevel }}
      # Records with no parsed level are kept.
      filter/loglevel:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number != SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_{{ $minLevel }}'
    {{- end }}
      batch:
        send_batch_size: {{ .Values.agent.batch.sendBatchSize }}
        send_batch_max_size: {{ .Values.agent.batch.sendBatchMaxSize }}
        timeout: {{ .Values.agent.batch.timeout }}

    exporters:
      otlp/gateway:
        endpoint: {{ include "otelcol.gatewayName" . }}.{{ include "otelcol.namespace" . }}:{{ .Values.ports.grpc }}
        tls:
          insecure: true
        # In-memory; not preserved across agent restarts.
        sending_queue:
          enabled: true
          queue_size: {{ .Values.agent.sendingQueueSize }}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
    {{- if .Values.debug.verboseExporter }}
      debug:
        verbosity: detailed
    {{- end }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:{{ .Values.ports.health }}
    {{- if $filelogOn }}
      file_storage/filelog:
        directory: /var/lib/otelcol/filelog
        create_directory: true
    {{- end }}

    service:
      extensions: [health_check{{ if $filelogOn }}, file_storage/filelog{{ end }}]
      telemetry:
        logs:
          level: {{ .Values.logLevel }}
        {{- if .Values.selfTelemetry.enabled }}
        metrics:
          level: {{ .Values.selfTelemetry.level }}
          address: 0.0.0.0:{{ .Values.ports.selfMetrics }}
        {{- end }}
      pipelines:
      {{- /*
        Gated on the gateway having a destination for the signal; the gateway
        rejects signals it has no pipeline for as Unimplemented.
      */}}
      {{- $metricsOn := include "otelcol.signalEnabled" (dict "root" $ "signal" "metrics") }}
      {{- if include "otelcol.signalEnabled" (dict "root" $ "signal" "traces") }}
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp/gateway{{ if .Values.debug.verboseExporter }}, debug{{ end }}]
      {{- end }}
      {{- if $metricsOn }}
        metrics:
          receivers: [otlp{{ if .Values.agent.prometheusScrape.enabled }}, prometheus{{ end }}{{ if .Values.agent.kubeletstats.enabled }}, kubeletstats{{ end }}]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp/gateway{{ if .Values.debug.verboseExporter }}, debug{{ end }}]
      {{- end }}
      {{- if include "otelcol.signalEnabled" (dict "root" $ "signal" "logs") }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp/gateway{{ if .Values.debug.verboseExporter }}, debug{{ end }}]
      {{- end }}
      {{- if $filelogOn }}
        # Separate so the level filter applies to filelog only.
        logs/filelog:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection{{ if $minLevel }}, filter/loglevel{{ end }}, batch]
          exporters: [otlp/gateway{{ if .Values.debug.verboseExporter }}, debug{{ end }}]
      {{- end }}
{{- end }}
