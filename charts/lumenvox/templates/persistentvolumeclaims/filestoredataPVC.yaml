apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-store-data-claim
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  accessModes:
  {{- if eq .Values.provider "azure" }}
    - ReadWriteMany
  {{- else if eq .Values.platform "minikube" }}
    - ReadWriteOnce
  {{- else if eq .Values.platform "cloud" }}
    - ReadWriteMany
  {{- end }}
  {{- if eq .Values.provider "azure" }}
  storageClassName: {{ .Values.azureStorageClassName }}
  {{- else }}
  volumeName: file-store-data
  storageClassName: ""
  {{- end }}
  resources:
    requests:
      storage: 10Gi
