{{- /* Serves the Gateway that lumenvox-common renders, so it's gated on that chart
(which also provides the lumenvox-common.gatewayNamespace helper used below). */}}
{{- if and .Values.global.enabled.lumenvoxCommon (eq .Values.global.lumenvox.ingress.className "istio") (not .Values.global.lumenvox.gateway.disableTls) }}
{{- $gatewayNs := include "lumenvox-common.gatewayNamespace" . }}
{{- $releaseNs := default .Release.Namespace .Values.global.defaultNamespace }}
{{- if ne $gatewayNs $releaseNs }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-secret-copy
  namespace: {{ $releaseNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-secret-copy-read
  namespace: {{ $releaseNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["{{ .Values.global.lumenvox.gateway.tlsSecretName }}"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-secret-copy-read
  namespace: {{ $releaseNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tls-secret-copy-read
subjects:
- kind: ServiceAccount
  name: tls-secret-copy
  namespace: {{ $releaseNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-secret-copy-write
  namespace: {{ $gatewayNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tls-secret-copy-write
  namespace: {{ $gatewayNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tls-secret-copy-write
subjects:
- kind: ServiceAccount
  name: tls-secret-copy
  namespace: {{ $releaseNs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tls-secret-copy-job
  namespace: {{ $releaseNs }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: tls-secret-copy
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              SECRET_NAME="{{ .Values.global.lumenvox.gateway.tlsSecretName }}"
              SOURCE_NS="{{ $releaseNs }}"
              TARGET_NS="{{ $gatewayNs }}"

              echo "Copying secret ${SECRET_NAME} from ${SOURCE_NS} to ${TARGET_NS}..."

              TLS_CRT=$(kubectl get secret "${SECRET_NAME}" -n "${SOURCE_NS}" -o jsonpath='{.data.tls\.crt}')
              TLS_KEY=$(kubectl get secret "${SECRET_NAME}" -n "${SOURCE_NS}" -o jsonpath='{.data.tls\.key}')

              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              type: kubernetes.io/tls
              metadata:
                name: ${SECRET_NAME}
                namespace: ${TARGET_NS}
              data:
                tls.crt: ${TLS_CRT}
                tls.key: ${TLS_KEY}
              EOF

              echo "Done."
{{- end }}
{{- end }}
