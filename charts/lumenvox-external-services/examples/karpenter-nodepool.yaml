# =============================================================================
# Example: a dedicated Karpenter node pool (AWS) for the external services.
#
# Without one, MongoDB, PostgreSQL, RabbitMQ and Redis can be scheduled onto the
# same nodes as the speech decode pods and compete with them for CPU, and a
# Redis master can land on the same node as its own replica, so one node loss
# takes a whole shard. The taint below keeps everything else off these nodes;
# pair it with this nodeSelector and toleration on each service in values:
#
#   nodeSelector:
#     workload: external-services
#   tolerations:
#     - key: workload
#       operator: Equal
#       value: external-services
#       effect: NoSchedule
#
# Replace the REPLACE-WITH-* placeholders, then:
#
#   kubectl apply -f karpenter-nodepool.yaml
#
# Karpenter provisions nothing until pods that tolerate the taint appear. Apply
# this before the helm change that adds the nodeSelector and tolerations, or
# those pods have nowhere to go.
#
# SIZING
# Sized for roughly 21 CPU / 16 GiB of requests across nine pods (RabbitMQ's
# 6 CPU is the largest single request): two m7a.4xlarge carry that, and the
# limit allows a third for headroom during rolls. Adjust the instance
# requirements and limits to your own requests. Keep at least two nodes: every
# service here is a singleton or a three-shard cluster, so a one-node pool makes
# node replacement a full data-tier outage.
# =============================================================================
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: external-services
spec:
  # Use the same node role and discovery tag as your existing Karpenter
  # EC2NodeClass, so this pool inherits the networking and IAM already in place.
  role: REPLACE-WITH-KARPENTER-NODE-ROLE
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE-WITH-CLUSTER-NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE-WITH-CLUSTER-NAME
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: external-services
spec:
  limits:
    cpu: 48          # three m7a.4xlarge; the workload needs two
    memory: 192Gi
  disruption:
    # WhenEmpty, not WhenEmptyOrUnderutilized. These nodes are deliberately
    # under-utilised -- 21 CPU of requests on 32 allocatable -- and
    # consolidation would keep trying to pack the data tier back onto the
    # decode fleet, which is the exact problem this pool exists to solve.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1h
    budgets:
      - nodes: "1"   # never disrupt more than one node of the data tier at once
  template:
    metadata:
      labels:
        workload: external-services
        managed-by: karpenter
    spec:
      # Never, not 720h. PostgreSQL, MongoDB and RabbitMQ are single replicas
      # on ReadWriteOnce volumes with maxUnavailable: 0 PDBs, so a node
      # expiry cannot drain cleanly -- it would stall on the budget instead.
      # Patching this pool has to be a deliberate maintenance action.
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: external-services
      # The taint is what keeps the decode fleet off these nodes. Only pods
      # that explicitly tolerate it land here.
      taints:
        - key: workload
          value: external-services
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # RabbitMQ alone requests 6 CPU in the sizing above, so anything smaller
        # than a 4xlarge leaves too little room for the rest of the tier. Any
        # instance family works; m7a is only an example.
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m7a"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["4xlarge"]
