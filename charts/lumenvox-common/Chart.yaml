apiVersion: v2
name: lumenvox-common
description: LumenVox Common Components Helm chart for Kubernetes
type: application
version: 8.0.0
appVersion: "8.0.0"
home: https://lumenvox.com
annotations:
  artifacthub.io/containsSecurityUpdates: true
  artifacthub.io/images: |
    - name: admin-portal
      image: lumenvox/admin-portal:8.0
    - name: archive
      image: lumenvox/archive:8.0
    - name: binary-storage
      image: lumenvox/storage:8.0
    - name: cloud-init-tools
      image: lumenvox/cloud-init-tools:8.0
    - name: configuration
      image: lumenvox/configuration:8.0
    - name: deployment
      image: lumenvox/deployment:8.0
    - name: deployment-portal
      image: lumenvox/deployment-portal:8.0
    - name: license
      image: lumenvox/license:8.0
    - name: management-api
      image: lumenvox/management-api:8.0
    - name: resource
      image: lumenvox/resource:8.0
    - name: file-store
      image: lumenvox/file-store:8.0
