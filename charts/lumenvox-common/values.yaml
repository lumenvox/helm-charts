# Default values for lumenvox-common.

image: {}

lumenvox:
  # Time to allow support services (such as databases) to become available. Typically, 0 in production
  deploymentStartDelaySeconds: 0

encryption:
  masterKeyProvider: "EnvVariableMasterKeyService"
  useEncryption: true

# Legacy linkerd configuration (deprecated, use serviceMesh.dashboard instead)
# Kept for backward compatibility
linkerd:
  dashboard:
    # Applies ingress for linkerd dashboard when enabled (true)
    enabled: false
    # Namespace used by linkerd dashboard
    namespace: linkerd-viz
    # Hostname prefix to use for ingress
    hostPrefix: linkerd

  # optional class name to assign to linkerd ingress (i.e. "nginx" for example)
  ingressClassName: ""

prometheus: {}

probes:
  # How many failed startup probes the resource service may accumulate before the
  # kubelet restarts it. It installs models and voices before reporting healthy,
  # and a first pass onto a shared (SMB/NFS) model volume runs for tens of minutes
  # per package - a restart part way through discards the staged work and starts
  # over. With periodSeconds set to 10 in the resource deployment, this default
  # works out to 720 x 10s = 2 hours.
  resourceStartupFailureThreshold: 720

global:
  lumenvox:
    # Controls the ingress mode. Supported values:
    #   "nginx" - use traditional nginx Ingress resources
    #   "istio" - use Kubernetes Gateway API with Istio (requires Istio installed)
    ingress:
      className: "nginx"
      # Lists of {name, value} nginx annotations. Defaults and usage notes live in
      # the parent lumenvox chart's values.yaml.
      commonAnnotations: []
      grpcAnnotations: []
      httpAnnotations: []
    gateway:
      className: istio
      name: lumenvox-gateway
      namespace: "istio-ingress"
      createIstioNamespace: true
      disableTls: false
      tlsSecretName: speech-tls-secret
      backendTimeout: "350s"
      # Optional annotations applied to the Gateway resource.
      # When using Istio, these are propagated to the generated LoadBalancer Service.
      # Example for AWS NLB:
      #   service.beta.kubernetes.io/aws-load-balancer-type: "external"
      #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      annotations: {}
      # Annotations placed on the Gateway's spec.infrastructure.annotations,
      # which Istio propagates onto the auto-generated LoadBalancer Service.
      # Use these - not gateway.annotations and not a manual patch on the
      # Service - for anything the cloud load balancer reads: Istio's gateway
      # controller owns that Service and reverts direct edits to it.
      # Example (Azure internal LB):
      #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      infrastructureAnnotations: {}
      # On provider "azure", point the LB health probe for the gateway's
      # listener port at Istio's status port (15021 /healthz/ready). Azure
      # otherwise probes HTTPS on the nodePort at path "/", which the gateway
      # cannot answer - every backend reads unhealthy and the LB drops all
      # traffic. Rendered as defaults so an upgrade cannot strip them by
      # omitting infrastructureAnnotations; those still override key-by-key.
      # Set false only when the LB probe is managed outside this chart.
      azureHealthProbeDefaults: true
    schedulerName: ""
  lidVersion: "2.0.0"
  serviceMesh: # Service mesh dashboard configuration
    dashboard:
      # Applies ingress for service mesh dashboard when enabled (true)
      enabled: false
      # Service mesh type: "linkerd" or "istio"
      type: "linkerd"
      # Namespace used by service mesh dashboard
      namespace: linkerd-viz  # For linkerd: linkerd-viz, For istio: istio-system
      # Hostname prefix to use for ingress
      hostPrefix: linkerd  # For linkerd: linkerd, For istio: istio
      # Opaque secret value for dashboard ingress authentication (base64 encoded)
      ingressSecret: ""
      # Optional class name to assign to dashboard ingress (i.e. "nginx" for example)
      ingressClassName: ""
# Enable default deployment creation job
enableDefaultDeployment: false
# Default deployment configuration
defaultDeployment:
  # Note: This deployment will not work without a valid deploymentID GUID value. (abcdefg-1234-abcd-1234-abcdefghijkl)
  customDeploymentId: "CONFIGURE-DEPLOYMENT-ID-HERE"
  description: "test-description"
  name: "test-name"
  # Optional: full connection strings override the auto-built ones from global.mongodb/postgresql/redis.
  # Leave empty to use the auto-built connection strings (from global config + secrets).
  connectionStrings:
    mongodb: ""
    postgresql: ""
    redis: ""
