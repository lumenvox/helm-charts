{{- $ingressClassName := .Values.global.lumenvox.ingress.className -}}
{{- if ne $ingressClassName "istio" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployment-portal-ingress
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
  annotations:
    # Internal staff route: internalAllowlist restricts it by source IP.
    {{- include "lumenvox-common.nginxAnnotations" (dict "kind" "http" "root" $ "allowlist" .Values.global.lumenvox.ingress.internalAllowlist) }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  {{- if not .Values.global.lumenvox.ingress.disableTls }}
  tls:
  - hosts:
    - "deployment-portal{{ .Values.global.hostnameSuffix }}"
    secretName: {{ .Values.global.lumenvox.gateway.tlsSecretName }}
  {{- end }}
  rules:
  - host: "deployment-portal{{ .Values.global.hostnameSuffix }}"
    http:
      paths:
      {{- if .Values.global.lumenvox.metrics.enableEndpoints }}
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: admin-portal-service
            port:
              name: http
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: admin-portal-service
            port:
              name: http
      - path: /alive
        pathType: Prefix
        backend:
          service:
            name: admin-portal-service
            port:
              name: http
      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: admin-portal-service
            port:
              name: http
      {{- end }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deployment-portal-service
            port:
              name: portal
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deployment-portal-httproute
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  parentRefs:
    - name: {{ .Values.global.lumenvox.gateway.name }}
      namespace: {{ include "lumenvox-common.gatewayNamespace" . }}
      sectionName: web
  hostnames:
    - "deployment-portal{{ .Values.global.hostnameSuffix }}"
  rules:
    {{- if .Values.global.lumenvox.metrics.enableEndpoints }}
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: admin-portal-service
          port: 5110
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: admin-portal-service
          port: 5110
    - matches:
        - path:
            type: PathPrefix
            value: /alive
      backendRefs:
        - name: admin-portal-service
          port: 5110
    - matches:
        - path:
            type: PathPrefix
            value: /ready
      backendRefs:
        - name: admin-portal-service
          port: 5110
    {{- end }}
    - backendRefs:
        - name: deployment-portal-service
          port: 3101
{{- end }}
