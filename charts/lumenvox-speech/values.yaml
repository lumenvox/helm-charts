# Default values for speech.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image: {}

global:
  # OpenTelemetry export from the services. Emits no OTEL_* environment while
  # disabled.
  #
  # With Istio and endpointMode "agent", add 4317 to
  # global.serviceMesh.istio.excludeOutboundPorts (e.g. "443,4317"), or the
  # sidecar drops traffic to $(NODE_IP):4317. endpointMode "gateway" does not
  # need this.
  otel:
    enabled: false
    # "agent"   - export to the node-local collector agent at $(NODE_IP).
    # "gateway" - export to the collector gateway Service.
    endpointMode: agent
    port: 4317
    protocol: grpc
    # Base name of the collector workloads. Defaults to the release name.
    collectorName: ""
    # Set only when the collector is installed as a separate Helm release.
    releaseName: ""
    # Overrides the derived gateway address.
    gatewayEndpoint: ""
    # service.namespace resource attribute.
    serviceNamespace: lumenvox
    # deployment.environment resource attribute, e.g. "staging" or "prod".
    environment: ""
    # Additional resource attributes (key: value). k8s.* attributes are added
    # by the collector.
    resourceAttributes: {}
    traces:
      enabled: true
      # Sampling is done by the collector gateway (tail sampling).
      sampler: parentbased_always_on
      samplerArg: ""
    metrics:
      enabled: true
    logs:
      # Leave false. Collect service logs with the collector's agent.filelog.
      enabled: false
    # Additional OTEL_* environment variables for every service.
    extraEnv: {}
  # asr/transcribe-realtime/transcribe-batch each load only the models listed
  # in their own mandatory ASR_ENCODERS/ASR_DECODERS-style env var (they don't
  # glob-load every model under /EuropaAsrModels). Everything about a single
  # language - its version, GPU use, and which extra models it loads - lives
  # in one entry here instead of being spread across multiple lists.
  #
  # Per-language fields:
  #   - version: optional, falls back to asrDefaultVersion.
  #   - fineTuned: optional, loads an additional asr_finetuned_model_<name>.
  #   - decoderLocale: locale used for the base decoder package name when it
  #     differs from `name` itself. Defaults to `name`, EXCEPT for languages
  #     with a known exception baked into the chart (currently just "en",
  #     which defaults to "en_us" - confirmed via resource-service logs;
  #     there is no bare asr_decoder_model_en package). You only need to set
  #     this explicitly for a language the chart doesn't already know about.
  #     To add/override a known exception for every asrLanguages entry across
  #     an install at once (instead of repeating decoderLocale per language),
  #     set global.asrDecoderLocaleDefaults, e.g.:
  #       global:
  #         asrDecoderLocaleDefaults:
  #           en: "en_us"     # already the chart's built-in default
  #           fr: "fr_fr"     # a newly-confirmed exception
  #   - services.<asr|transcribeRealtime|transcribeBatch>: per-service
  #     behavior for this language, keyed by service name. A service omitted
  #     here gets the chart defaults (base: true, gpu: false).
  #       - base: whether this service loads the base (suffix-less) ENCODER
  #         for the language. Defaults to true; set false to narrow e.g. a
  #         hidef-only transcribeRealtime. Only encoders have a "default
  #         model" concept, so this does not affect the base decoder - every
  #         service always loads the base decoder.
  #       - gpu: either a bare bool (shorthand for just overriding `enabled`)
  #         or an object overriding any of enabled/count/visibleDevices/
  #         runtimeClassName for this one language+service. Anything not set
  #         here falls back to the chart-wide default in global.gpu.<service>
  #         (see lumenvox/values.yaml).
  #   - extraModels: extra downloadable models for this language beyond its
  #     base encoder/decoder (e.g. hidef variants), each optionally taking
  #     `services: [...]` (default: all three) to scope which service(s)
  #     load it.
  #
  #   asrLanguages:
  #     - name: "en"          # no decoderLocale needed - "en_us" is built in
  #       fineTuned: true
  #       services:
  #         asr:
  #           gpu: true
  #         transcribeRealtime:
  #           gpu: true
  #           base: false      # transcribeRealtime is hidef-only for "en"
  #         transcribeBatch:
  #           gpu: { enabled: true, count: 2 }
  #       extraModels:
  #         - name: "asr_encoder_hidef_model_en"
  #           version: "8.0.0"
  #           services: ["asr", "transcribeBatch"]
  #         - name: "asr_decoder_hidef_model_en_us"
  #           version: "8.0.0"
  #     - name: "fr"           # everything else defaults
  asrLanguages: []
  itnLanguages: []
  ttsLanguages: []
  # Shared ASR packages that aren't tied to any one language (e.g. the
  # dist_package_model_asr/backend_dnn_model_p download packages). These are
  # download-only and never loaded by asr/transcribe-realtime/transcribe-batch;
  # a per-language loadable model belongs under that language's
  # asrLanguages[].extraModels instead. e.g.:
  #   customAsrModels:
  #     - name: "dist_package_model_asr"
  #       version: "7.2.0"
  customAsrModels: []
  lidLanguages: []
  neuronModels: []
  # Neuron languages - one deployment per language (same pattern as asrLanguages)
  neuronLanguages: []
  # KEDA autoscaling defaults, see global.keda in the lumenvox chart's values.yaml.
  keda:
    enabled: false
    prometheus:
      serverAddress: ""
    pollingInterval: ""
    cooldownPeriod: ""
    scaleDownStabilizationSeconds: ""
    metricType: ""
    nameSuffix: ""
    query:
      orVectorZero: true
      selector: ""
    fallback:
      failureThreshold: 3
      replicas: ""
      behavior: ""
    requireFallback: false
  lumenvox:
    ingress:
      disableTls: false
      commonAnnotations: []
      grpcAnnotations: []
      httpAnnotations: []
    schedulerName: ""

probes:
  # How many failed startup probes each service may accumulate before the kubelet
  # restarts it. With periodSeconds from global.lumenvox.probes (5 by default),
  # 12 is 1 minute, 36 is 3 minutes and 60 is 5 minutes.
  #
  # asr, transcribe-realtime and transcribe-batch load every encoder and decoder
  # they're configured for before reporting healthy, and large extra models
  # (multi-GB encoders loaded onto a GPU) can take well over a minute. Batch pods
  # often start many at once when autoscaling, which slows model loading on
  # shared nodes.
  asrStartupFailureThreshold: 12
  transcribeRealtimeStartupFailureThreshold: 12
  transcribeBatchStartupFailureThreshold: 36
  # grammar and legacy TTS open their health port only after loading their
  # configuration, which can take several minutes.
  grammarStartupFailureThreshold: 45
  ttsStartupFailureThreshold: 60
  neuralTtsStartupFailureThreshold: 12

asr:
  useFakeResult: "false"
  cacheMaxEntries: "1000"
  cacheMaxSizeMb: "500"
  # Sets ASR_SETTINGS__MAX_ACTIVE_REQUESTS (concurrent requests per pod). Empty
  # leaves it unset so the service uses its built-in default. When GPU is on for
  # a language, global.gpu.<service>.maxActiveRequests (or the per-language
  # services.<service>.gpu.maxActiveRequests) wins over this.
  maxActiveRequests: ""

transcribeRealtime:
  # Audio buffer length (ms) used by the realtime transcription engine.
  europaBufferMs: "800"
  # Single switch for FlowSense: true sets both FLOWSENSE_ENABLED and
  # FLOWSENSE_GATE env vars to "1"; false (default) sets both to "0".
  enableFlowSense: false
  # Granular overrides. When set to a non-empty QUOTED string ("0"/"1"),
  # each wins over enableFlowSense for its env var; leave empty ("") to
  # derive from enableFlowSense.
  flowSenseEnabled: ""
  flowSenseGate: ""
  # Sets ASR_SETTINGS__MAX_ACTIVE_REQUESTS (concurrent requests per pod). Empty
  # leaves it unset so the service uses its built-in default. When GPU is on for
  # a language, global.gpu.<service>.maxActiveRequests (or the per-language
  # services.<service>.gpu.maxActiveRequests) wins over this.
  maxActiveRequests: ""

transcribeBatch:
  # Sets ASR_SETTINGS__MAX_ACTIVE_REQUESTS (concurrent requests per pod). Empty
  # leaves it unset so the service uses its built-in default. When GPU is on for
  # a language, global.gpu.<service>.maxActiveRequests (or the per-language
  # services.<service>.gpu.maxActiveRequests) wins over this.
  maxActiveRequests: ""
  # PodDisruptionBudget per transcribe-batch-<lang> deployment. Stops a voluntary
  # eviction (e.g. Karpenter consolidation) from removing the last ready pod while
  # the autoscaler is also scaling down, which can leave no ready batch pod for
  # 45-90 s. Off by default: with a single replica it also blocks node drains
  # and Karpenter drift replacement until a second pod exists. Pair it with
  # consolidationPolicy: WhenEmpty on the GPU NodePool.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

grammar:
  maxGrammarTransitions: ""
  useLegacyEnhanced: false

tts:
  useFakeResult: "false"
  # Inaudible watermark on Neural TTS and Legacy TTS audio, marking it as synthetic
  # speech. level sets what happens when a watermark cannot be applied: "strict"
  # returns an error, "relaxed" returns the audio without a watermark.
  watermarking:
    enabled: true
    level: strict
  # Optional: override neural-tts resources. When not set, platform "cloud" uses limits cpu: 3000m, memory: 20000Mi
  #  requests:
  #    cpu: 2000m
  #    memory: 4000Mi
  #  limits:
  #    cpu: 3000m
  #    memory: 8000Mi
  neuralTtsResources: {}

lumenvoxApi:
  # Lets a client reconnect to an existing session.
  enableSessionReconnect: false
  # Sessions with no activity for this long are closed, e.g. "30m" or "2h".
  inactiveSessionCloseTimeout: "60m"

vad:
  redisDataTimeout: ""
