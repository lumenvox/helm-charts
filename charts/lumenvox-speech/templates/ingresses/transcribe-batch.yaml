{{- if .Values.global.lumenvox.metrics.enableEndpoints }}
{{- if .Values.global.transcribeBatch.enabled }}
{{- $ingressClassName := $.Values.global.lumenvox.ingress.className -}}
{{- range .Values.global.asrLanguages }}
---
{{- if ne $ingressClassName "istio" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transcribe-batch-{{ .name | replace "_" "-" }}-ingress
  namespace: {{ default $.Release.Namespace $.Values.global.defaultNamespace }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  rules:
  - host: "transcribe-batch-{{ .name | replace "_" "-" }}{{ $.Values.global.hostnameSuffix }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transcribe-batch-{{ .name | replace "_" "-" }}-service
            port:
              name: http
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transcribe-batch-{{ .name | replace "_" "-" }}-httproute
  namespace: {{ default $.Release.Namespace $.Values.global.defaultNamespace }}
spec:
  parentRefs:
    - name: {{ $.Values.global.lumenvox.gateway.name }}
      namespace: {{ include "lumenvox-common.gatewayNamespace" $ }}
      sectionName: web
  hostnames:
    - "transcribe-batch-{{ .name | replace "_" "-" }}{{ $.Values.global.hostnameSuffix }}"
  rules:
    - backendRefs:
        - name: transcribe-batch-{{ .name | replace "_" "-" }}-service
          port: 5110
{{- end }}
{{- end }}
{{- end }}
{{- end }}
