{{- if .Values.global.lumenvox.metrics.enableEndpoints }}
{{- $ingressClassName := .Values.global.lumenvox.ingress.className -}}
{{- if ne $ingressClassName "istio" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reporting-api-ingress-http
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  {{- if $ingressClassName }}
  ingressClassName: {{ $ingressClassName }}
  {{- end }}
  {{- if not .Values.global.lumenvox.ingress.disableTls }}
  tls:
  - hosts:
    - "reporting-api{{ .Values.global.hostnameSuffix }}"
    secretName: {{ .Values.global.lumenvox.gateway.tlsSecretName }}
  {{- end }}
  rules:
  - host: "reporting-api{{ .Values.global.hostnameSuffix }}"
    http:
      paths:
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: reporting-api-service
            port:
              name: http
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: reporting-api-service
            port:
              name: http
      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: reporting-api-service
            port:
              name: http
{{- else }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reporting-api-httproute-metrics
  namespace: {{ default .Release.Namespace .Values.global.defaultNamespace }}
spec:
  parentRefs:
    - name: {{ .Values.global.lumenvox.gateway.name }}
      namespace: {{ include "lumenvox-common.gatewayNamespace" . }}
      sectionName: web
  hostnames:
    - "reporting-api{{ .Values.global.hostnameSuffix }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: reporting-api-service
          port: 5110
    - matches:
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: reporting-api-service
          port: 5110
    - matches:
        - path:
            type: PathPrefix
            value: /ready
      backendRefs:
        - name: reporting-api-service
          port: 5110
{{- end }}
{{- end }}
