{{- if not .Values.global.minimalInstall }}
{{- if .Values.global.asr.enabled }}
{{- range .Values.global.asrLanguages }}
{{- $asrGpu := include "lumenvox-speech.RESOLVE_SERVICE_GPU" (dict "root" $ "lang" . "service" "asr") | fromJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-{{ .name | replace "_" "-" }}
  namespace: {{ default $.Release.Namespace $.Values.global.defaultNamespace }}
  labels:
    app: asr-{{ .name | replace "_" "-" }}
spec:
  selector:
    matchLabels:
      app: asr-{{ .name | replace "_" "-" }}
  template:
    metadata:
      labels:
        app: asr-{{ .name | replace "_" "-" }}
{{- include "lumenvox-common.serviceMeshLabels" $ | indent 8 }}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '5110'
{{- include "lumenvox-common.serviceMeshAnnotations" $ | indent 8 }}
{{- include "lumenvox-common.POD_ANNOTATIONS" (dict "root" $ "service" "asr" "name" (printf "asr-%s" (.name | replace "_" "-")) "langCfg" (dig "services" "asr" (dict) .)) }}
{{- $drain := include "lumenvox-speech.DRAIN" (dict "root" $ "service" "asr" "name" (printf "asr-%s" (.name | replace "_" "-")) "langCfg" (dig "services" "asr" (dict) .) "grace" 300) | fromJson }}
    spec:
      terminationGracePeriodSeconds: {{ $drain.grace }}
      containers:
        - name: asr
          image: {{ $.Values.image.repository | default $.Values.global.image.repository }}/asr{{ $.Values.image.tag | default $.Values.global.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy | default $.Values.global.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          ports:
            - name: http
              containerPort: 5110
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.global.lumenvox.service.startDelaySeconds }}
            periodSeconds: {{ $.Values.global.lumenvox.probes.periodSeconds }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ $.Values.probes.asrStartupFailureThreshold }}
            periodSeconds: {{ $.Values.global.lumenvox.probes.periodSeconds }}
          {{- if $.Values.global.lumenvox.service.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.global.lumenvox.service.startDelaySeconds }}
            periodSeconds: {{ $.Values.global.lumenvox.probes.periodSeconds }}
          {{- end }}
          {{- $res := include "lumenvox-common.RESOLVE_SERVICE_RESOURCES" (dict "root" $ "lang" . "service" "asr" "cpu" "1000m" "memory" "4000Mi") | fromJson }}
          {{- $lim := include "lumenvox-common.RESOLVE_SERVICE_RESOURCES" (dict "root" $ "lang" . "service" "asr" "kind" "limits" "cpu" "1500m" "memory" "8000Mi" "requests" $res) | fromJson }}
          resources:
            requests:
              {{- if $res.cpu }}
              cpu: {{ $res.cpu }}
              {{- end }}
              {{- if $res.memory }}
              memory: {{ $res.memory }}
              {{- end }}
            {{- if or $lim.cpu $lim.memory .fineTuned $asrGpu.enabled }}
            limits:
              {{- if $lim.cpu }}
              cpu: {{ $lim.cpu }}
              {{- end }}
              {{- if $lim.memory }}
              memory: {{ $lim.memory }}
              {{- end }}
              {{- if or .fineTuned $asrGpu.enabled }}
              nvidia.com/gpu: '{{ if $asrGpu.enabled }}{{ $asrGpu.count }}{{ else }}1{{ end }}'
              {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: timezone-configmap
            {{- if $.Values.global.rabbitmq.auth.existingPasswordSecret }}
            - secretRef:
                name: {{ $.Values.global.rabbitmq.auth.existingPasswordSecret }}
            {{- end }}
            {{- if $.Values.global.redis.auth.existingSecret }}
            - secretRef:
                name: {{ $.Values.global.redis.auth.existingSecret }}
            {{- end }}
          env:
            {{- with (include "lumenvox-common.otelEnv" (dict "root" $ "service" "asr") | trim) }}{{ . | nindent 12 }}{{- end }}
            {{- if not $.Values.global.rabbitmq.auth.existingPasswordSecret }}
            - name: rabbitmq-password
              value: '{{ $.Values.global.rabbitmq.auth.password }}'
            {{- end }}
            {{- if not $.Values.global.redis.auth.existingSecret }}
            - name: redis-password
              value: '{{ $.Values.global.redis.auth.password }}'
            {{- end }}
            - name: GLOBAL_SETTINGS__CLUSTER_LOG_VERBOSITY
              value: '{{ $.Values.global.lumenvox.loggingVerbosity }}'
            - name: LICENSE_SETTINGS__CLUSTER_GUID
              value: '{{ $.Values.global.licensing.clusterGuid }}'  
            - name: REDIS_SETTINGS__DEFAULT_TTL
              value: '{{ $.Values.global.lumenvox.redisTtl }}'
            - name: RMQ_CA_CERTIFICATE
              value: '{{ $.Values.global.rabbitmq.caCertificate }}'
            - name: RMQ_CLIENT_CERTIFICATE
              value: '{{ $.Values.global.rabbitmq.clientCertificate }}'
            - name: RMQ_CLIENT_KEY
              value: '{{ $.Values.global.rabbitmq.clientKey }}'
            - name: GLOBAL_SETTINGS__RABBITMQ_CONNECTION_STRING
              value: 'amqp{{ if $.Values.global.rabbitmq.enableTLS }}s{{ end }}://{{ $.Values.global.rabbitmq.connection.user }}:$(rabbitmq-password)@{{ $.Values.global.rabbitmq.connection.url }}:{{ $.Values.global.rabbitmq.connection.port }}/{{ $.Values.global.rabbitmq.connection.vhost | urlquery }}'
            - name: GLOBAL_SETTINGS__RMQ_QUEUE_EXPIRE_MS
              value: '{{ $.Values.global.lumenvox.rabbitmqQueueExpirationMs }}'
            - name: SERVICE_ADDRESSES__CONFIGURATION_SERVICE
              value: 'configuration-service.{{ default $.Release.Namespace $.Values.global.defaultNamespace }}:5000'
            - name: SERVICE_ADDRESSES__DEPLOYMENT_SERVICE
              value: 'deployment-service.{{ default $.Release.Namespace $.Values.global.defaultNamespace }}:5000'
            - name: ASR_SETTINGS__SERVICE_LANGUAGE
              value: '{{ .name }}'
            - name: ASR_SETTINGS__CACHE_MAX_ENTRIES
              value: '{{ $.Values.asr.cacheMaxEntries }}'
            - name: ASR_SETTINGS__CACHE_MAX_SIZE_MB
              value: '{{ $.Values.asr.cacheMaxSizeMb }}'
            - name: ASR_ENCODERS
              value: '{{ template "lumenvox-speech.SERVICE_ASR_MODELS" (dict "root" $ "lang" . "service" "asr" "kind" "encoder") }}'
            - name: ASR_DECODERS
              value: '{{ template "lumenvox-speech.SERVICE_ASR_MODELS" (dict "root" $ "lang" . "service" "asr" "kind" "decoder") }}'
            {{- if .fineTuned }}
            - name: ASR_SETTINGS__ENABLE_FINE_TUNED
              value: '1'
            {{- end }}
            {{- $maxActiveRequests := $.Values.asr.maxActiveRequests }}
            {{- if and $asrGpu.enabled $asrGpu.maxActiveRequests }}
            {{- $maxActiveRequests = $asrGpu.maxActiveRequests }}
            {{- end }}
            {{- if $maxActiveRequests }}
            - name: ASR_SETTINGS__MAX_ACTIVE_REQUESTS
              value: '{{ $maxActiveRequests }}'
            {{- end }}
            {{- if $asrGpu.enabled }}
            - name: ASR_SETTINGS__ENABLE_GPU
              value: 'true'
            {{- if $asrGpu.visibleDevices }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: '{{ $asrGpu.visibleDevices }}'
            {{- end }}
            {{- end }}
            - name: GOLANG_PROTOBUF_REGISTRATION_CONFLICT
              value: 'ignore'
            {{- if $drain.seconds }}
            - name: DRAIN_TIMEOUT_SECONDS
              value: '{{ $drain.seconds }}'
            {{- end }}
          volumeMounts:
            - mountPath: /usr/local/lib/python3.12/dist-packages
              name: lang
              subPath: DistPackageModels/asr/dist-packages
            {{- if .fineTuned }}
            - mountPath: /finetuned/venv/lib/python3.8/site-packages
              name: lang
              subPath: DistPackageModels/finetuned/site-packages
            {{- end }}
            - mountPath: /EuropaAsrModels
              name: lang
              subPath: EuropaAsrModels
            - mountPath: /var/lumenvox/cache
              name: europa-cache
            - mountPath: /BackendModels
              name: lang
              subPath: BackendModels
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range $.Values.global.imagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- include "lumenvox-common.POD_SCHEDULING" (dict "root" $ "service" "asr" "name" (printf "asr-%s" (.name | replace "_" "-")) "langCfg" (dig "services" "asr" (dict) .) "baseTolerations" (ternary $asrGpu.tolerations (list) $asrGpu.enabled)) }}
      initContainers:
        - name: wait-for-deployment-service
          image: {{ $.Values.image.repository | default $.Values.global.image.repository }}/cloud-init-tools{{ $.Values.image.tag | default $.Values.global.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy | default $.Values.global.image.pullPolicy }}
          command: ["curl2"]
          args: ["http://deployment-service.{{ default $.Release.Namespace $.Values.global.defaultNamespace }}:5110/health", "Deployment Service"]
        - name: wait-for-resource-manager
          image: {{ $.Values.image.repository | default $.Values.global.image.repository }}/cloud-init-tools{{ $.Values.image.tag | default $.Values.global.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy | default $.Values.global.image.pullPolicy }}
          command: ["curl2"]
          args: ["http://resource-service.{{ default $.Release.Namespace $.Values.global.defaultNamespace }}:5110/health", "Resource Manager Service"]
      volumes:
        - name: lang
          persistentVolumeClaim:
            claimName: lang-claim
            readOnly: false
        - name: europa-cache
          persistentVolumeClaim:
            claimName: europa-cache-claim
            readOnly: false
      {{- if $.Values.global.lumenvox.schedulerName }}
      schedulerName: {{ $.Values.global.lumenvox.schedulerName }}
      {{- end }}
      {{- if $asrGpu.enabled }}
      {{- if $asrGpu.runtimeClassName }}
      runtimeClassName: {{ $asrGpu.runtimeClassName }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}